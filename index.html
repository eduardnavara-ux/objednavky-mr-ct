<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objednávky MR / CT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Objednávky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f3d5e">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --navy: #0f3d5e; --navy-2: #1c5a85; --bg: #f3f5f8; --card: #fff; --text: #17212b;
    --muted: #66727f; --line: #e2e7ee; --ok: #1f7a4d; --ok-bg: #e7f5ee; --warn: #8a5a00; --warn-bg: #fff4dc;
    --err: #b42318; --err-bg: #fdecea; --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--navy); color: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 0; }
  header .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .who { font-size: 12px; opacity: .8; background: none; border: 0; color: #fff; padding: 4px 0; }
  nav { display: flex; gap: 4px; margin-top: 10px; }
  nav button { flex: 1; background: transparent; color: #cfe0ee; border: 0; padding: 10px 4px 12px;
    font: inherit; font-weight: 600; border-bottom: 3px solid transparent; }
  nav button.on { color: #fff; border-bottom-color: #7cc4ff; }
  nav .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px;
    background: rgba(255,255,255,.18); font-size: 12px; line-height: 20px; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 12px calc(env(safe-area-inset-bottom) + 40px); }
  .card { background: var(--card); border-radius: var(--r); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(16,24,40,.06); border: 1px solid var(--line); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 4px 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; }
  input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #cdd5df; border-radius: 10px;
    background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid #7cc4ff; border-color: var(--navy-2); }
  textarea { min-height: 160px; resize: vertical; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 420px) { .grid2.resp { grid-template-columns: 1fr; } }
  button, .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 14px; border: 1px solid #cdd5df;
    background: #fff; color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; }
  button.primary, .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  button.ok, .btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
  button:disabled { opacity: .5; }
  .full { width: 100%; margin-top: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { padding: 6px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #eef3f8; border: 1px solid #d6e1ec; }
  .seg { display: flex; background: #eef3f8; border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px; }
  .seg button.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .item { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .grow { min-width: 0; }
  small, .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: #eef3f8; color: var(--navy); font-weight: 600; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-top: 8px; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 12px; }
  .okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 12px; }
  .quote { font-style: italic; color: var(--muted); font-size: 13px; border-left: 3px solid var(--line); padding-left: 8px; margin-top: 8px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  details summary { cursor: pointer; color: var(--navy-2); font-size: 14px; margin-top: 8px; }
  pre.mail { white-space: pre-wrap; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f9fb;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0 0; }
  .terms { margin: 6px 0 0; padding: 0; list-style: none; }
  .terms li { padding: 4px 0; display: flex; gap: 6px; align-items: baseline; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff;
    border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .login { max-width: 380px; margin: 40px auto; }
  .chk { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .chk input { width: auto; }
  .rec { background: #c0262d; border-color: #c0262d; color: #fff; }
  .big { padding: 16px; font-size: 18px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .cislo { font-size: 22px; font-weight: 700; letter-spacing: .03em; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%);
    background: #17212b; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 10; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SonioxClient } from "https://esm.sh/@soniox/speech-to-text-web@1.4.0";

// ---------- Nastavení ----------
const SUPABASE_URL = "https://cjgfarbusdvieempommt.supabase.co";
const SUPABASE_KEY = "sb_publishable_TVLQbs-h-4FMHu44Znq2sA_Q7uHMyEm";
// Telefon do mailu pro změnu / zrušení termínu
const TEL = { MR: "257273202", CT: "257272510" };
// Výchozí čísla recepce (založí se do záložky Čísla při prvním spuštění)
const VOLAT = { MR: "257273202", CT: "257272510" };
const VYCHOZI_KONTAKTY = [
  { nazev: "Recepce MR", telefon: VOLAT.MR, typ: "MR", poradi: 1 },
  { nazev: "Recepce CT (obstřiky)", telefon: VOLAT.CT, typ: "CT", poradi: 2 },
];
const MISTA = {
  "2p": "Nemocnice Na Homolce, 2.patro, prostor operačních sálů neurochirurgie",
  "gama": "Nemocnice Na Homolce, budova Gama nože, při spodní vrátnici",
  "4p": "Nemocnice Na Homolce, 4.patro",
};
const MISTA_KRATCE = { "2p": "2. patro", "gama": "Gama", "4p": "4. patro" };
const RYCHLE = ["MR Lp", "MR Cp", "obstřik SIK pod CT", "PRT "];
// Konverzace v Claude, kde se diktuje hovor (stále stejná, ať nevznikají nové)
const CLAUDE_CHAT = "https://claude.ai/chat/16b5c444-abb4-4901-ab2f-ba9c950255c0";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const app = document.getElementById("app");

const S = {
  user: null, tab: "fronta", rows: [], editId: null, kontakty: [], editKontakt: null,
  hovorTyp: "MR", vybrano: null, prepis: "", vysledek: null, busy: false,
  msg: null, showOld: false, loginMode: "login",
};

// ---------- Pomocné ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = encodeURIComponent;
const typZVykonu = (v) => (/^\s*MR\b/i.test(v || "") ? "MR" : "CT");
const dnesISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDatum = (d) => { if (!d) return "?"; const [y, m, dd] = d.split("-").map(Number); return `${dd}.${m}.${y}`; };
const fmtCas = (t) => { if (!t) return "?"; const [h, mi] = t.split(":"); return `${Number(h)}:${mi}`; };
const DNY = ["ne", "po", "út", "st", "čt", "pá", "so"];
const denTydne = (d) => DNY[new Date(d + "T12:00:00").getDay()];
const mistoKod = (text) => Object.keys(MISTA).find((k) => MISTA[k] === text) || null;
const mistoKratce = (text) => MISTA_KRATCE[mistoKod(text)] || text || "?";

function genitivPredmet(v) {
  const m = (v || "").trim();
  if (/^MR\s*Lp$/i.test(m)) return "MR bederní páteře";
  if (/^MR\s*Cp$/i.test(m)) return "MR krční páteře";
  if (/^obstřik\b/i.test(m)) return "obstřiku" + m.slice(7);
  return m;
}
function vykonVeVete(v) {
  const m = (v || "").trim();
  if (/^obstřik\b/i.test(m)) return "obstřiku" + m.slice(7);
  return m;
}
function sestavMail(rows) {
  const r = [...rows].sort((a, b) => (a.termin_datum + a.termin_cas).localeCompare(b.termin_datum + b.termin_cas));
  const predmet = "termín " + r.map((x) => genitivPredmet(x.vykon)).join(" a ");
  const vety = r.map((x, i) =>
    `${i ? "Termín" : "termín"} ${vykonVeVete(x.vykon)} je objednán na ${fmtDatum(x.termin_datum)}, ${fmtCas(x.termin_cas)} hod., ${x.misto}. Pro změnu, či zrušení termínu tel.: ${TEL[x.typ]}.`);
  if (r.every((x) => x.typ === "MR")) vety[vety.length - 1] += " Po absolvování MR se pro konzultaci výsledků objednejte na mou ambulanci přes recepci.";
  const telo = `Dobrý den,\n\n${vety.join("\n\n")}\n\nS pozdravem,\nNavara`;
  return { predmet, telo };
}
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const gmailWeb = (to, su, body) => `https://mail.google.com/mail/?view=cm&fs=1&to=${enc(to || "")}&su=${enc(su)}&body=${enc(body)}`;
const gmailApp = (to, su, body) => `googlegmail:///co?to=${enc(to || "")}&subject=${enc(su)}&body=${enc(body)}`;

function varovani(datum, cas) {
  const w = [];
  if (datum) {
    const den = new Date(datum + "T12:00:00").getDay();
    if (den === 0 || den === 6) w.push("Termín vychází na víkend.");
    if (datum < dnesISO()) w.push("Datum je v minulosti.");
  }
  if (cas) { const h = Number(cas.split(":")[0]); if (h < 6 || h >= 20) w.push("Čas je mimo 6:00–20:00."); }
  return w;
}

let toastT;
function toast(t) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
}

// ---------- Data ----------
async function nacti() {
  const { data, error } = await sb.from("objednavky").select("*").neq("stav", "zruseno")
    .order("created_at", { ascending: true }).limit(2000);
  if (error) { S.msg = { t: "err", m: "Načtení selhalo: " + error.message }; return; }
  S.rows = data;
  await nactiKontakty();
}
async function nactiKontakty() {
  let { data, error } = await sb.from("kontakty").select("*").order("poradi").order("nazev");
  if (error) { S.msg = { t: "err", m: "Načtení čísel selhalo: " + error.message }; return; }
  if (!data.length && !S.kontaktySeeded) {
    S.kontaktySeeded = true;
    await sb.from("kontakty").insert(VYCHOZI_KONTAKTY);
    ({ data } = await sb.from("kontakty").select("*").order("poradi").order("nazev"));
  }
  S.kontakty = data || [];
}
const cislo = (typ) => S.kontakty.find((k) => k.typ === typ)?.telefon || VOLAT[typ];
const telHref = (t) => "tel:" + String(t).replace(/[^\d+]/g, "");
const cekajici = (typ) => S.rows.filter((r) => r.stav === "ceka" && (!typ || r.typ === typ));

// ---------- Render ----------
function render() {
  if (!S.user) { app.innerHTML = viewLogin(); return; }
  const nCeka = cekajici().length;
  const nMail = S.rows.filter((r) => r.stav === "objednano" || r.stav === "koncept").length;
  app.innerHTML = `
  <header>
    <div class="top"><h1>Objednávky MR / CT</h1><button class="who" data-act="odhlasit">Odhlásit</button></div>
    <nav>
      <button class="${S.tab === "fronta" ? "on" : ""}" data-act="tab" data-v="fronta">Fronta<span class="n">${nCeka}</span></button>
      <button class="${S.tab === "hovor" ? "on" : ""}" data-act="tab" data-v="hovor">Hovor</button>
      <button class="${S.tab === "terminy" ? "on" : ""}" data-act="tab" data-v="terminy">Termíny${nMail ? `<span class="n">${nMail}</span>` : ""}</button>
      <button class="${S.tab === "cisla" ? "on" : ""}" data-act="tab" data-v="cisla">Čísla</button>
    </nav>
  </header>
  <main>
    ${S.msg ? `<div class="${S.msg.t === "err" ? "err" : "okmsg"}">${esc(S.msg.m)}</div>` : ""}
    ${S.tab === "fronta" ? viewFronta() : S.tab === "hovor" ? viewHovor() : S.tab === "cisla" ? viewCisla() : viewTerminy()}
  </main>`;
  const ta = document.getElementById("prepis"); if (ta) ta.value = S.prepis;
}

function viewLogin() {
  const reg = S.loginMode === "register";
  return `<main><div class="card login">
    <h2>${reg ? "Vytvořit účet" : "Přihlášení"}</h2>
    ${S.msg ? `<div class="${S.msg.t === "err" ? "err" : "okmsg"}">${esc(S.msg.m)}</div>` : ""}
    <form data-form="login">
      <label class="f">E-mail</label><input name="email" type="email" autocomplete="username" required>
      <label class="f">Heslo</label><input name="heslo" type="password" autocomplete="${reg ? "new-password" : "current-password"}" minlength="8" required>
      <button class="primary full" ${S.busy ? "disabled" : ""}>${reg ? "Vytvořit účet" : "Přihlásit"}</button>
    </form>
    <button class="ghost full" data-act="loginmode">${reg ? "Mám účet – přihlásit" : "První spuštění – vytvořit účet"}</button>
  </div></main>`;
}

function viewFronta() {
  const sekce = (typ) => {
    const list = cekajici(typ);
    return `<div class="card">
      <div class="row between"><h2 style="margin:0">${typ === "MR" ? "MR" : "CT obstřiky"} – čeká ${list.length}</h2>
        ${list.length ? `<div class="row"><a class="btn" href="${telHref(cislo(typ))}">📞 Volat</a>
        <button class="primary" data-act="nahovor" data-v="${typ}">Zpracovat hovor</button></div>` : ""}</div>
      <div style="margin-top:6px">${list.length ? list.map(itemFronta).join("") : `<div class="empty">Nikdo nečeká.</div>`}</div>
    </div>`;
  };
  return `
  ${viewZeZpravy()}
  <div class="card">
    <h2>Přidat pacienta ručně</h2>
    <form data-form="pridat" autocomplete="off">
      <input name="jmeno" placeholder="Jméno (příjmení)" required>
      <div class="grid2 resp" style="margin-top:8px">
        <input name="email" type="email" placeholder="E-mail (nepovinné)" inputmode="email">
        <input name="telefon" placeholder="Telefon (nepovinné)" inputmode="tel">
      </div>
      <div class="chips">${RYCHLE.map((v) => `<button type="button" class="chip" data-act="rychly" data-v="${esc(v)}">${esc(v.trim())}</button>`).join("")}</div>
      <input name="vykon" id="vykon" placeholder="Výkon – např. MR Lp, PRT C6 vpravo" required>
      <input name="poznamka" placeholder="Poznámka (nepovinné)" style="margin-top:8px">
      <button class="primary full">Přidat do fronty</button>
    </form>
  </div>
  ${sekce("MR")}${sekce("CT")}`;
}

function itemFronta(r) {
  if (S.editId === r.id) {
    return `<form class="item" data-form="upravit" data-id="${r.id}" style="display:block">
      <input name="jmeno" value="${esc(r.jmeno)}" required>
      <div class="grid2 resp" style="margin-top:8px"><input name="email" type="email" value="${esc(r.email)}" placeholder="E-mail"><input name="telefon" value="${esc(r.telefon)}" placeholder="Telefon" inputmode="tel"></div>
      <div class="grid2 resp" style="margin-top:8px"><input name="vykon" value="${esc(r.vykon)}" required><input name="poznamka" value="${esc(r.poznamka)}" placeholder="Poznámka"></div>
      <div class="row" style="margin-top:8px"><button class="primary">Uložit</button><button type="button" data-act="zrusedit">Zpět</button>
      <span class="grow"></span><button type="button" class="ghost" data-act="smazat" data-id="${r.id}">Smazat</button></div>
    </form>`;
  }
  return `<div class="item">
    <div class="grow"><b>${esc(r.jmeno)}</b> <span class="tag">${esc(r.vykon)}</span><br>
      <small>${r.email ? esc(r.email) : "bez e-mailu"}${r.telefon ? ` · <a href="${telHref(r.telefon)}">${esc(r.telefon)}</a>` : ""}${r.poznamka ? " · " + esc(r.poznamka) : ""}</small></div>
    <button class="ghost" data-act="edit" data-id="${r.id}" aria-label="Upravit">✎</button>
  </div>`;
}

const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();

function viewZeZpravy() {
  const z = S.zpravy;
  let obsah = "";
  if (z?.busy) obsah = `<div class="okmsg" style="margin:10px 0 0">⏳ Čtu ${z.pocet} ${z.pocet === 1 ? "fotku" : "fotky"}…</div>`;
  else if (z?.polozky) {
    obsah = z.polozky.length ? z.polozky.map((p, i) => `
      <div class="card" style="margin:10px 0 0;background:#fafbfc">
        <div class="row between"><b>${esc(p.jmeno) || "?"}</b>
          <label class="chk"><input type="checkbox" data-z="${i}" data-k="pridat" ${p.pridat ? "checked" : ""}> přidat</label></div>
        <input data-z="${i}" data-k="jmeno" value="${esc(p.jmeno)}" placeholder="Jméno" style="margin-top:6px">
        <div class="grid2 resp" style="margin-top:8px">
          <input data-z="${i}" data-k="email" value="${esc(p.email)}" placeholder="E-mail" type="email" inputmode="email">
          <input data-z="${i}" data-k="telefon" value="${esc(p.telefon)}" placeholder="Telefon" inputmode="tel"></div>
        <div class="grid2 resp" style="margin-top:8px">
          <input data-z="${i}" data-k="vykon" value="${esc(p.vykon)}" placeholder="Výkon">
          <input data-z="${i}" data-k="poznamka" value="${esc(p.poznamka)}" placeholder="Poznámka"></div>
        ${p.duplicita ? `<div class="warn">⚠︎ Stejný pacient s tímto výkonem už ve frontě čeká.</div>` : ""}
        ${!p.email ? `<div class="warn">⚠︎ Na zprávě jsem nenašel e-mail.</div>` : ""}
        ${p.nejiste ? `<div class="warn">⚠︎ ${esc(p.nejiste)}</div>` : ""}
      </div>`).join("") : `<div class="empty">Na fotkách jsem nenašel žádného pacienta.</div>`;
    obsah += `<div class="grid2" style="margin-top:10px">
      <button data-act="zpravyzrusit">Zahodit</button>
      ${z.polozky.length ? `<button class="ok" data-act="zpravypridat">Přidat do fronty</button>` : ""}</div>`;
  }
  return `<div class="card">
    <div class="row between"><h2 style="margin:0">Ze zprávy</h2>
      <label class="btn primary" ${z?.busy ? 'style="opacity:.5;pointer-events:none"' : ""}>📷 Vyfotit zprávu
        <input id="foto" type="file" accept="image/*" multiple hidden></label></div>
    <small>Vyfoťte hlavičku i doporučení. Můžete vybrat víc fotek a víc pacientů najednou.</small>
    ${obsah}
  </div>`;
}

async function zmensiObrazek(file, max = 2000) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return { media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
  } finally { URL.revokeObjectURL(url); }
}

async function nactiZpravy(files) {
  files = [...files].slice(0, 8);
  if (!files.length) return;
  S.zpravy = { busy: true, pocet: files.length }; S.msg = null; render();
  let obrazky;
  try { obrazky = await Promise.all(files.map((f) => zmensiObrazek(f))); }
  catch { S.zpravy = null; S.msg = { t: "err", m: "Fotku se nepodařilo načíst." }; render(); return; }
  const { data, error } = await sb.functions.invoke("nacti-zpravu", { body: { obrazky } });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j.error) m = j.error; } catch {}
    S.zpravy = null; S.msg = { t: "err", m: "Čtení zprávy selhalo: " + m }; render(); return;
  }
  const polozky = [];
  for (const p of data.pacienti || []) {
    const vykony = p.vykony?.length ? p.vykony : [""];
    for (const v of vykony) {
      const duplicita = !!v && cekajici().some((r) => norm(r.jmeno) === norm(p.jmeno) && norm(r.vykon) === norm(v));
      polozky.push({ jmeno: p.jmeno || "", email: p.email || "", telefon: p.telefon || "", vykon: v, poznamka: p.poznamka || "",
        nejiste: p.nejiste || (!v ? "Na zprávě jsem nenašel, co objednat." : null), duplicita, pridat: !!v && !duplicita });
    }
  }
  S.zpravy = { polozky }; render();
}

function skupinyPacientu(list) {
  const m = new Map();
  for (const r of list) {
    const key = r.gmail_draft_id ? "d:" + r.gmail_draft_id : r.email ? "e:" + r.email.toLowerCase() : "j:" + r.jmeno.toLowerCase().trim();
    if (!m.has(key)) m.set(key, []);
    m.get(key).push(r);
  }
  return [...m.values()].map((rows) => rows.sort((a, b) => (a.termin_datum + a.termin_cas).localeCompare(b.termin_datum + b.termin_cas)));
}
const gmailKonceptyUrl = () => (isIOS() ? "googlegmail://" : "https://mail.google.com/mail/u/0/#drafts");

async function volejGmail(body) {
  const { data, error } = await sb.functions.invoke("gmail", { body });
  if (error) { let m = error.message; try { const j = await error.context.json(); if (j.error) m = j.error; } catch {} return { error: m }; }
  return data;
}
async function pripravKoncepty(skupiny) {
  if (!skupiny.length) return { pocet: 0 };
  const maily = skupiny.map((rows) => {
    const { predmet, telo } = sestavMail(rows);
    return { klic: rows.map((r) => r.id).join(","), to: rows.find((r) => r.email)?.email || "", predmet, telo };
  });
  const res = await volejGmail({ action: "koncepty", maily });
  if (res.error) return res;
  const now = new Date().toISOString();
  for (const v of res.vysledky || []) {
    await sb.from("objednavky").update({ stav: "koncept", gmail_draft_id: v.draftId, gmail_message_id: v.messageId, koncept_at: now })
      .in("id", v.klic.split(","));
  }
  await nacti();
  return { pocet: (res.vysledky || []).length };
}
let kontrolaBezi = false;
async function kontrolaStavu() {
  const skup = skupinyPacientu(S.rows.filter((r) => r.stav === "koncept" && r.gmail_draft_id));
  if (!skup.length || kontrolaBezi) return;
  kontrolaBezi = true;
  const polozky = skup.map((rows) => ({ draftId: rows[0].gmail_draft_id, to: rows.find((r) => r.email)?.email || "", predmet: sestavMail(rows).predmet }));
  const res = await volejGmail({ action: "stav", polozky });
  kontrolaBezi = false;
  if (res.error) return;
  let zmena = false;
  for (const v of res.vysledky || []) {
    if (v.stav === "odeslano") {
      await sb.from("objednavky").update({ stav: "mail_odeslan", mail_odeslan_at: new Date().toISOString() }).eq("gmail_draft_id", v.draftId); zmena = true;
    } else if (v.stav === "smazano") {
      await sb.from("objednavky").update({ stav: "objednano", gmail_draft_id: null, gmail_message_id: null }).eq("gmail_draft_id", v.draftId); zmena = true;
    }
  }
  S.posledniKontrola = new Date();
  if (zmena) await nacti();
  if (S.tab === "terminy") render();
}

  return `

app.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target; const fd = Object.fromEntries(new FormData(f));
  const kind = f.dataset.form;
  S.msg = null;
  if (kind === "login") {
    S.busy = true; render();
    const email = fd.email.trim(), password = fd.heslo;
    if (S.loginMode === "register") {
      const { error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      S.busy = false;
      S.msg = error ? { t: "err", m: error.message } : { t: "ok", m: "Účet vytvořen. Potvrďte e-mail odkazem ve schránce a pak se přihlaste." };
      if (!error) S.loginMode = "login";
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      S.busy = false;
      if (error) S.msg = { t: "err", m: error.message === "Invalid login credentials" ? "Špatný e-mail nebo heslo." : error.message };
    }
    render(); return;
  }
  if (kind === "pridat") {
    const vykon = fd.vykon.trim();
    const row = { jmeno: fd.jmeno.trim(), email: fd.email.trim() || null, telefon: (fd.telefon || "").trim() || null, vykon, typ: typZVykonu(vykon), poznamka: fd.poznamka.trim() || null };
    const { error } = await sb.from("objednavky").insert(row);
    if (error) { S.msg = { t: "err", m: "Uložení selhalo: " + error.message }; render(); return; }
    await nacti(); S.vybrano = null; render(); toast("Přidáno do fronty");
    document.querySelector('input[name="jmeno"]')?.focus();
    return;
  }
  if (kind === "kontakt") {
    const zaznam = { nazev: fd.nazev.trim(), telefon: fd.telefon.trim(), typ: fd.typ || null };
    if (zaznam.typ) {
      // jedno číslo na typ – ostatním typ odebrat
      const q = sb.from("kontakty").update({ typ: null }).eq("typ", zaznam.typ);
      await (f.dataset.id ? q.neq("id", f.dataset.id) : q);
    }
    const res = f.dataset.id
      ? await sb.from("kontakty").update(zaznam).eq("id", f.dataset.id)
      : await sb.from("kontakty").insert({ ...zaznam, poradi: zaznam.typ ? 1 : 100 });
    if (res.error) S.msg = { t: "err", m: res.error.message };
    S.editKontakt = null; await nactiKontakty(); render(); toast("Uloženo"); return;
  }
  if (kind === "upravit") {
    const vykon = fd.vykon.trim();
    const { error } = await sb.from("objednavky").update({
      jmeno: fd.jmeno.trim(), email: fd.email.trim() || null, telefon: (fd.telefon || "").trim() || null, vykon, typ: typZVykonu(vykon), poznamka: fd.poznamka.trim() || null,
    }).eq("id", f.dataset.id);
    if (error) S.msg = { t: "err", m: error.message };
    S.editId = null; await nacti(); S.vybrano = null; render(); return;
  }
});

  if (act === "tab") { S.tab = b.dataset.v; S.msg = null; render(); window.scrollTo(0, 0); if (S.tab === "terminy") kontrolaStavu(); return; }
  if (act === "loginmode") { S.loginMode = S.loginMode === "login" ? "register" : "login"; S.msg = null; render(); return; }
  if (act === "odhlasit") { await sb.auth.signOut(); return; }
  if (act === "rychly") { const i = document.getElementById("vykon"); i.value = b.dataset.v; i.focus(); i.setSelectionRange(i.value.length, i.value.length); return; }
  if (act === "edit") { S.editId = b.dataset.id; render(); return; }
  if (act === "zrusedit") { S.editId = null; render(); return; }
  if (act === "smazat") {
    if (!confirm("Smazat pacienta z fronty?")) return;
    await sb.from("objednavky").delete().eq("id", b.dataset.id);
    S.editId = null; await nacti(); S.vybrano = null; render(); return;
  }
  if (act === "nahovor") { S.tab = "hovor"; S.hovorTyp = b.dataset.v; S.vybrano = null; render(); window.scrollTo(0, 0); return; }
  if (act === "hovortyp") { S.hovorTyp = b.dataset.v; S.vybrano = null; render(); return; }
  if (act === "schranka") {
    try {
      const t = (await navigator.clipboard.readText()).trim();
      if (!t) { toast("Schránka je prázdná"); return; }
      const ta = document.getElementById("prepis");
      const dosavad = (ta?.value || S.prepis || "").trim();
      S.prepis = dosavad ? dosavad + "\n\n--- další hovor ---\n\n" + t : t;
      if (ta) ta.value = S.prepis;
      toast(dosavad ? "Přidáno jako další hovor" : "Vloženo");
    }
    catch { toast("Schránku nejde přečíst – vložte ručně"); }
    return;
  }
  if (act === "vytahni") return vytahni();
  if (act === "vlozitzpracovat") {
    let t = "";
    try { t = await navigator.clipboard.readText(); } catch { toast("Schránku nejde přečíst – vložte text do pole ručně"); return; }
    if (!t || t.trim().length < 10) { toast("Ve schránce není přepis"); return; }
    S.prepis = t; const ta = document.getElementById("prepis"); if (ta) ta.value = t;
    return vytahni();
  }
  if (act === "nahravat") return motor() === "soniox" ? nahravatStart() : diktovatStart();
  if (act === "motor") { try { localStorage.setItem("prepisMotor", motor() === "soniox" ? "apple" : "soniox"); } catch {} render(); return; }
  if (act === "nahravatstop") {
    b.disabled = true; b.textContent = "Dokončuji přepis…";
    if (sr) { srStop = true; try { sr.stop(); } catch { srKonec(); } } else rec?.stop();
    return;
  }
  if (act === "zahodit") { S.vysledek = null; render(); return; }
  if (act === "potvrdit") return potvrdit();
  if (act === "kopirovat") {
    const rows = S.rows.filter((r) => b.dataset.ids.split(",").includes(r.id));
    const { predmet, telo } = sestavMail(rows);
    try { await navigator.clipboard.writeText(`${predmet}\n\n${telo}`); toast("Zkopírováno"); } catch { toast("Kopírování selhalo"); }
    return;
  }
  if (act === "odeslano") {
    const ids = b.dataset.ids.split(",");
    const { error } = await sb.from("objednavky").update({ stav: "mail_odeslan", mail_odeslan_at: new Date().toISOString() }).in("id", ids);
    if (error) S.msg = { t: "err", m: error.message };
    await nacti(); render(); toast("Označeno jako odeslané"); return;
  }
  if (act === "zrusit") {
    if (!confirm("Zrušit tento termín? (zůstane jen v databázi jako zrušený)")) return;
    await sb.from("objednavky").update({ stav: "zruseno" }).eq("id", b.dataset.id);
    await nacti(); render(); return;
  }
  if (act === "stare") { S.showOld = !S.showOld; render(); return; }
  if (act === "kontrola") { b.disabled = true; b.textContent = "Kontroluji…"; await kontrolaStavu(); render(); return; }
  if (act === "koncept") {
    b.disabled = true; b.textContent = "Vytvářím…";
    const rows = S.rows.filter((r) => b.dataset.ids.split(",").includes(r.id));
    const res = await pripravKoncepty([rows]);
    S.msg = res.error ? { t: "err", m: "Koncept se nepodařilo vytvořit: " + res.error } : null;
    render(); if (!res.error) toast("Koncept je v Gmailu"); return;
  }
  if (act === "zpravyzrusit") { S.zpravy = null; render(); return; }
  if (act === "zpravypridat") {
    const vyber = S.zpravy.polozky.filter((p) => p.pridat);
    if (!vyber.length) { toast("Nic není vybráno"); return; }
    if (vyber.some((p) => !p.jmeno.trim() || !p.vykon.trim())) { toast("Doplňte jméno a výkon"); return; }
    const rows = vyber.map((p) => ({ jmeno: p.jmeno.trim(), email: p.email.trim() || null, telefon: p.telefon.trim() || null,
      vykon: p.vykon.trim(), typ: typZVykonu(p.vykon), poznamka: p.poznamka.trim() || null }));
    const { error } = await sb.from("objednavky").insert(rows);
    if (error) { S.msg = { t: "err", m: "Uložení selhalo: " + error.message }; render(); return; }
    S.zpravy = null; S.vybrano = null; await nacti(); render(); toast(`Přidáno do fronty: ${rows.length}`); return;
  }
  if (act === "kontaktedit") { S.editKontakt = b.dataset.id; render(); return; }
  if (act === "kontaktzpet") { S.editKontakt = null; render(); return; }
  if (act === "kontaktsmazat") {
    if (!confirm("Smazat toto číslo?")) return;
    await sb.from("kontakty").delete().eq("id", b.dataset.id);
    S.editKontakt = null; await nactiKontakty(); render(); return;
  }
});

app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "prepis") { S.prepis = t.value; return; }
  if (t.dataset.z !== undefined && t.type !== "checkbox") { S.zpravy.polozky[+t.dataset.z][t.dataset.k] = t.value; return; }
  if (t.dataset.i !== undefined && t.type !== "checkbox" && t.tagName !== "SELECT") {
    S.vysledek.terminy[+t.dataset.i][t.dataset.k] = t.value;
  }
});

app.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "foto") { const files = [...t.files]; t.value = ""; return nactiZpravy(files); }
  if (t.dataset.z !== undefined) {
    const p = S.zpravy.polozky[+t.dataset.z];
    if (t.type === "checkbox") p[t.dataset.k] = t.checked; else p[t.dataset.k] = t.value;
    if (t.dataset.k === "jmeno") render();
    return;
  }
  if (t.dataset.sel) { t.checked ? S.vybrano.add(t.dataset.sel) : S.vybrano.delete(t.dataset.sel); return; }
  if (t.dataset.i !== undefined) {
    const item = S.vysledek.terminy[+t.dataset.i];
    if (t.type === "checkbox") { item[t.dataset.k] = t.checked; return; }
    item[t.dataset.k] = t.value || null;
    if (t.tagName === "SELECT" || t.dataset.k === "datum" || t.dataset.k === "cas") render();
    return;
  }
  if (t.dataset.emailIds) {
    const email = t.value.trim() || null;
    const { error } = await sb.from("objednavky").update({ email }).in("id", t.dataset.emailIds.split(","));
    if (error) { S.msg = { t: "err", m: error.message }; }
    await nacti(); render(); toast("E-mail uložen"); return;
  }
});

// ---------- Nahrávání zdarma (Web Speech API – na iPhonu Apple, v Chrome Google) ----------
const motor = () => { try { return localStorage.getItem("prepisMotor") || "apple"; } catch { return "apple"; } };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr = null, srStop = false, srSession = "";
function srKonec() {
  R.final += srSession ? srSession + " " : ""; srSession = "";
  sr = null; nahravatUklid(); prepisZobraz(""); render();
  if (S.prepis.trim().length > 20) vytahni(); else toast("Přepis je prázdný");
}
async function diktovatStart() {
  if (!SR) {
    S.msg = { t: "err", m: "Tento prohlížeč neumí přepis zdarma. Klepněte do pole Přepis a použijte diktování na klávesnici (ikona mikrofonu), nebo přepněte na Soniox." };
    render(); return;
  }
  R.final = S.prepis ? S.prepis.trim() + "\n" : ""; srSession = ""; srStop = false;
  S.nahrava = true; S.msg = null; S.vysledek = null; render();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  const t0 = Date.now();
  recTimer = setInterval(() => {
    const el = document.getElementById("rectime"); if (!el) return;
    const sec = Math.floor((Date.now() - t0) / 1000); el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  }, 1000);
  const spust = () => {
    sr = new SR();
    sr.lang = "cs-CZ"; sr.continuous = true; sr.interimResults = true;
    sr.onresult = (ev) => {
      let fin = "", interim = "";
      for (let i = 0; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) fin += t + " "; else interim += t;
      }
      srSession = fin.trim();
      prepisZobraz((srSession ? srSession + " " : "") + interim);
    };
    sr.onerror = (ev) => {
      if (ev.error === "no-speech" || ev.error === "aborted") return;
      srStop = true;
      S.msg = { t: "err", m: ev.error === "not-allowed" || ev.error === "service-not-allowed"
        ? "Přepis zdarma není povolený (mikrofon / rozpoznávání řeči). Na iPhonu otevřete aplikaci v Safari, nebo použijte diktování na klávesnici."
        : "Přepis selhal: " + ev.error };
    };
    sr.onend = () => {
      if (!srStop) { // prohlížeč ukončil sám (ticho) – pokračujeme dál
        R.final += srSession ? srSession + " " : ""; srSession = "";
        try { spust(); return; } catch {}
      }
      srKonec();
    };
    sr.start();
  };
  try { spust(); } catch (e) { srStop = true; srKonec(); S.msg = { t: "err", m: "Přepis nejde spustit: " + e.message }; render(); }
}

// ---------- Nahrávání (Soniox) ----------
let rec = null, wakeLock = null, recTimer = null;
const R = { final: "", spk: null };
function prepisZobraz(nonfinal) {
  S.prepis = (R.final + nonfinal).replace(/^\n+/, "");
  const ta = document.getElementById("prepis");
  if (ta) { ta.value = S.prepis; ta.scrollTop = ta.scrollHeight; }
}
function nahravatUklid() {
  clearInterval(recTimer); recTimer = null;
  try { wakeLock?.release(); } catch {}
  wakeLock = null; rec = null; S.nahrava = false;
}
async function nahravatStart() {
  if (!SonioxClient.isSupported) { toast("Tento prohlížeč neumí nahrávat"); return; }
  R.final = S.prepis ? S.prepis.trim() + "\n" : ""; R.spk = null;
  S.nahrava = true; S.msg = null; S.vysledek = null; render();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  const t0 = Date.now();
  recTimer = setInterval(() => {
    const el = document.getElementById("rectime"); if (!el) return;
    const sec = Math.floor((Date.now() - t0) / 1000); el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  }, 1000);
  const terms = ["magnetická rezonance", "MR", "bederní páteř", "krční páteř", "obstřik", "PRT", "Gama nůž", "Homolka",
    "operační sály", "neurochirurgie", ...cekajici().map((r) => r.jmeno)];
  rec = new SonioxClient({
    apiKey: async () => {
      const { data, error } = await sb.functions.invoke("soniox-klic", { body: {} });
      if (error) { let m = error.message; try { const j = await error.context.json(); if (j.error) m = j.error; } catch {} throw new Error(m); }
      return data.api_key;
    },
  });
  rec.start({
    model: "stt-rt-v6",
    languageHints: ["cs"],
    enableSpeakerDiarization: true,
    context: { general: [{ key: "domain", value: "Healthcare" }, { key: "topic", value: "Telefonické objednání pacientů na MR a CT obstřiky v nemocnici" }], terms },
    audioConstraints: { echoCancellation: false, noiseSuppression: false, autoGainControl: true },
    onPartialResult(res) {
      let nonfinal = "";
      for (const t of res.tokens || []) {
        if (!t.text || t.text === "<end>") continue;
        if (t.is_final) {
          if (t.speaker && t.speaker !== R.spk) { R.final += `\nMluvčí ${t.speaker}: `; R.spk = t.speaker; R.final += t.text.replace(/^\s+/, ""); }
          else R.final += t.text;
        } else nonfinal += t.text;
      }
      prepisZobraz(nonfinal);
    },
    onFinished() {
      nahravatUklid(); prepisZobraz(""); render();
      if (S.prepis.trim().length > 20) vytahni(); else toast("Přepis je prázdný");
    },
    onError(status, message) {
      nahravatUklid(); prepisZobraz("");
      S.msg = { t: "err", m: "Nahrávání selhalo: " + (message || status) }; render();
    },
  });
}

async function vytahni() {
  const prepis = (document.getElementById("prepis")?.value || "").trim();
  S.prepis = prepis;
  if (prepis.length < 10) { toast("Nejdřív vložte přepis"); return; }
  const fronta = cekajici().filter((r) => S.vybrano.has(r.id)).map((r) => ({ id: r.id, jmeno: r.jmeno, vykon: r.vykon }));
  S.busy = true; S.msg = null; S.vysledek = null; render();
  const { data, error } = await sb.functions.invoke("vytahni-terminy", { body: { prepis, typ: "ALL", dnes: dnesISO(), fronta } });
  S.busy = false;
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j.error) m = j.error; } catch {}
    S.msg = { t: "err", m: "Zpracování selhalo: " + m }; render(); return;
  }
  const platneId = new Set(cekajici().map((r) => r.id));
  S.vysledek = {
    terminy: (data.terminy || []).map((t) => {
      const fr = t.fronta_id && platneId.has(t.fronta_id) ? t.fronta_id : null;
      const zFronty = S.rows.find((r) => r.id === fr);
      return { ...t, fronta_id: fr, vykon: t.vykon || zFronty?.vykon || "", email: "", ulozit: true };
    }),
    neobjednani: data.neobjednani || [],
  };
  render();
}

async function potvrdit() {
  const items = S.vysledek.terminy.filter((t) => t.ulozit);
  for (const t of items) {
    const kdo = t.fronta_id ? S.rows.find((r) => r.id === t.fronta_id)?.jmeno : t.jmeno;
    if (!t.fronta_id && !(t.jmeno || "").trim()) { toast("Doplňte jméno nového pacienta"); return; }
    if (!t.datum || !t.cas) { toast(`Doplňte datum a čas – ${kdo}`); return; }
    if (!t.misto || (t.misto === "jine" && !(t.misto_text || "").trim())) { toast(`Doplňte místo – ${kdo}`); return; }
    if (!(t.vykon || "").trim()) { toast(`Doplňte výkon – ${kdo}`); return; }
  }
  const ids = items.filter((t) => t.fronta_id).map((t) => t.fronta_id);
  if (new Set(ids).size !== ids.length) { toast("Jeden pacient je přiřazen dvakrát"); return; }
  S.busy = true; render();
  const now = new Date().toISOString();
  for (const t of items) {
    const misto = t.misto === "jine" ? t.misto_text.trim() : MISTA[t.misto];
    const vykon = t.vykon.trim();
    const zaznam = { stav: "objednano", termin_datum: t.datum, termin_cas: t.cas, misto, vykon, typ: typZVykonu(vykon), objednano_at: now };
    const res = t.fronta_id
      ? await sb.from("objednavky").update(zaznam).eq("id", t.fronta_id)
      : await sb.from("objednavky").insert({ ...zaznam, jmeno: t.jmeno.trim(), email: (t.email || "").trim() || null });
    if (res.error) { S.busy = false; S.msg = { t: "err", m: "Uložení selhalo: " + res.error.message }; await nacti(); render(); return; }
  }
  S.vysledek = null; S.prepis = ""; S.vybrano = null;
  await nacti();
  const r = await pripravKoncepty(skupinyPacientu(S.rows.filter((x) => x.stav === "objednano" && x.termin_datum)));
  S.busy = false; S.tab = "terminy";
  S.msg = r.error
    ? { t: "err", m: `Uloženo ${items.length} termínů, ale koncepty se nepodařilo vytvořit: ${r.error}` }
    : { t: "ok", m: `Uloženo ${items.length} termínů, v Gmailu připraveno ${r.pocet} konceptů. Zkontrolujte je a odešlete.` };
  render(); window.scrollTo(0, 0);
}

// ---------- Start ----------
sb.auth.onAuthStateChange(async (_ev, session) => {
  const u = session?.user || null;
  if (u?.id === S.user?.id) return;
  S.user = u;
  if (u) { await nacti(); }
  else { S.rows = []; }
  render();
});
const { data: { session } } = await sb.auth.getSession();
S.user = session?.user || null;
if (S.user) { await nacti(); if (cekajici().length) S.tab = "hovor"; }
render();
if (S.user) kontrolaStavu();
</script>
